<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="批量图片转换：统一大小与比例">
<!-- 安全：CSP 禁止一切网络连接与外部资源，仅允许内联脚本/样式与本地 WASM -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>图片批量转换 · 统一大小</title>
<!--STYLE-->
</head>
<body>
<header class="topbar">
  <h1>图片批量转换</h1>
</header>

<main>
  <!-- 导入区 -->
  <section id="dropZone" tabindex="0" role="button" aria-label="拖入图片或文件夹">
    <div class="drop-icon">⬆</div>
    <p class="drop-title">拖入图片或文件夹到此处</p>
    <p class="drop-sub">或点击下方按钮选择 · 支持整文件夹（含子文件夹）</p>
    <div class="drop-actions">
      <button type="button" class="btn primary" id="btnPickFiles">选择图片</button>
      <button type="button" class="btn" id="btnPickFolder">选择文件夹</button>
    </div>
    <input type="file" id="fileInput" multiple accept="image/*" hidden>
    <input type="file" id="folderInput" webkitdirectory multiple hidden>
  </section>

  <!-- 设置 -->
  <details id="settingsPanel" open>
    <summary>输出设置</summary>
    <div class="settings-grid">
      <label class="field">目标大小
        <input type="number" id="targetKB" min="30" max="2048" step="1" value="100">
        <span class="unit">KB（30 – 2048）</span>
      </label>
      <label class="field">输出尺寸（物理）
        <div class="dim-row">
          <input type="number" id="sizeW" min="0.2" max="50" step="0.1" value="1.2">
          <span class="dim-x">×</span>
          <input type="number" id="sizeH" min="0.2" max="50" step="0.1" value="1.8">
          <span class="unit">cm</span>
        </div>
        <span class="unit" id="pxHint">起始约 189 × 283 像素</span>
      </label>
      <label class="field">输出格式
        <select id="formatSelect">
          <option value="png" selected>PNG（无损，默认）</option>
          <option value="jpeg">JPEG（.jpg）</option>
          <option value="jpg">JPG（.jpg）</option>
          <option value="auto">保持原格式</option>
        </select>
      </label>
      <label class="field">容差
        <input type="number" id="tolerance" min="1" max="10" step="1" value="2">
        <span class="unit">% · 大小允许的浮动范围</span>
      </label>
      <label class="field">画质策略
        <select id="qualityMode">
          <option value="high" selected>高质量（推荐）</option>
          <option value="res">高分辨率（实验）</option>
        </select>
      </label>
      <label class="field">主题
        <select id="themeSelect">
          <option value="auto" selected>跟随系统</option>
          <option value="light">亮色</option>
          <option value="dark">暗色</option>
        </select>
      </label>
      <label class="field check"><input type="checkbox" id="enhanceToggle" checked> 增强低清晰度图像（上采样 + 锐化）</label>
    </div>
    <p class="hint">所有输出图片的物理尺寸严格一致（如上所设）。像素精度（DPI）由目标大小实时演算：系统为每张图确定恰好能承载目标大小的像素密度（低熵图自动提高 DPI，高熵图保持适当 DPI），物理尺寸不变，只调整像素。DPI 已写入文件元数据（JPEG JFIF / PNG pHYs）。裁剪规则：过宽图居中裁左右；过高图按 3:7 裁上下（上 30% / 下 70%）。</p>
  </details>

  <!-- 列表 -->
  <section id="listSection">
    <div id="listEmpty" class="empty">尚未导入图片 — 拖入、选择图片或选择文件夹</div>
    <ul id="fileList" class="file-list"></ul>
  </section>

  <!-- 底部操作栏 -->
  <section class="actionbar" id="actionbar">
    <div class="stats" id="statsBar">0 张图片</div>
    <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
    <div class="actions">
      <button type="button" class="btn primary" id="btnConvert">开始转换</button>
      <button type="button" class="btn" id="btnCancel" disabled>取消</button>
      <button type="button" class="btn" id="btnReconvert" disabled>重新转换</button>
      <button type="button" class="btn accent" id="btnExportZip" disabled>下载 ZIP</button>
      <button type="button" class="btn ghost" id="btnClearDone" disabled>移除已完成</button>
      <button type="button" class="btn ghost" id="btnClearAll" disabled>全部清除</button>
    </div>
  </section>
</main>

<script><!--MOZJPEG_GLUE--></script>
<script id="mozjpegWasm"><!--MOZJPEG_WASM--></script>
<script><!--OXIPNG_GLUE--></script>
<script id="oxipngWasm"><!--OXIPNG_WASM--></script>
<script><!--LOGIC--></script>
<script><!--APP--></script>
</body>
</html>
